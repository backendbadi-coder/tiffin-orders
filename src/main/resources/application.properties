spring.application.name=tiffin-orders

# ---------- RabbitMQ (AMQP 0.9.1) ----------
# Matches compose.yaml. In the Spring Boot 4.2 AMQP 1.0 upgrade these keys move to spring.amqp.rabbitmq.*
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tiffin
spring.rabbitmq.password=tiffin

# ---------- H2 in-memory database (resets on every restart) ----------
spring.datasource.url=jdbc:h2:mem:ordersdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Tiffin Orders
info.app.spring-boot=4.1
info.app.messaging=RabbitMQ AMQP 0.9.1
